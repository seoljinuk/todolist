<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todolist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Todolist</h1>

    <form id="todo-form" class="todo-form">
      <textarea
        id="todo-input"
        rows="2"
        placeholder="할 일을 입력하세요 (여러 줄 입력 가능 / multiline supported, Ctrl+Enter로 빠른 추가)"
      ></textarea>
      <button type="submit">추가</button>
    </form>

    <div class="todo-meta">
      <span id="todo-count">전체 0개</span>
      <div class="todo-meta-actions">
        <button id="export-file" type="button">파일로 내보내기</button>
        <button id="clear-completed" type="button">완료 항목 삭제</button>
      </div>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-message" class="empty-message">할 일이 없습니다. 새로운 할 일을 추가해보세요!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
